<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VISITORS // SHIELDBEARER ADMIN</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    connect-src 'self' https://*.execute-api.us-east-1.amazonaws.com https://*.lambda-url.us-east-1.on.aws;
    img-src 'self' data:;
    font-src 'self';
  " />
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --panel: #0a0606;
      --panel-2: #160a0a;
      --line: #e74c3c;
      --line-soft: rgba(231, 76, 60, 0.22);
      --text: #f0c9c4;
      --text-strong: #ffe9e5;
      --muted: #c98a82;
      --ok: #1cff57;
      --font: "Courier New", Courier, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(231, 76, 60, 0.10), transparent 38%),
        linear-gradient(180deg, #000 0%, #050202 100%);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
    }
    h1, h2, h3 { color: var(--text-strong); letter-spacing: .14em; font-weight: 700; }
    a { color: var(--line); }

    #passGate {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #000; text-align: center; padding: 24px;
    }
    #passGate h1 { font-size: 16px; margin-bottom: 18px; }
    #passGate input {
      background: #0a0606; border: 1px solid var(--line-soft); color: var(--text);
      font: inherit; padding: 10px 14px; min-width: 260px; outline: none;
    }
    #passGate input:focus { border-color: var(--line); }
    #passGate button {
      margin-top: 12px; background: var(--line); border: 0; color: #000;
      padding: 10px 22px; cursor: pointer; font: inherit; letter-spacing: .12em;
    }
    #passGate .err { color: var(--line); margin-top: 12px; font-size: 13px; min-height: 1em; }
    .pass-locked > .wrap { display: none; }

    .wrap { max-width: 1280px; margin: 0 auto; padding: 28px 20px 60px; }
    .header { border-bottom: 1px solid var(--line-soft); padding-bottom: 14px; margin-bottom: 22px; }
    .header h1 { font-size: 20px; margin: 0; }
    .header p { color: var(--muted); margin: 8px 0 0; font-size: 12px; letter-spacing: .08em; }

    .toolbar {
      display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
      margin-bottom: 20px;
    }
    .toolbar input {
      flex: 1; min-width: 220px; background: var(--panel); border: 1px solid var(--line-soft);
      color: var(--text); font: inherit; padding: 9px 12px; outline: none;
    }
    .toolbar input:focus { border-color: var(--line); }
    .toolbar button {
      background: transparent; border: 1px solid var(--line); color: var(--line);
      font: inherit; padding: 9px 18px; cursor: pointer; letter-spacing: .1em;
    }
    .toolbar button:hover { background: var(--line); color: #000; }

    .summary {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px; margin-bottom: 22px;
    }
    .card {
      background: var(--panel); border: 1px solid var(--line-soft); padding: 14px 16px;
    }
    .card .label { color: var(--muted); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
    .card .value { color: var(--text-strong); font-size: 26px; margin-top: 6px; }
    .card .sub { color: var(--muted); font-size: 11px; margin-top: 4px; }

    .sessions { display: flex; flex-direction: column; gap: 14px; }
    .session {
      background: var(--panel); border: 1px solid var(--line-soft); padding: 14px 16px;
    }
    .session__head {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline;
      gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line-soft); margin-bottom: 10px;
    }
    .session__id {
      font-size: 11px; color: var(--muted); letter-spacing: .1em;
      font-family: var(--font); word-break: break-all;
    }
    .session__meta {
      font-size: 13px; color: var(--text-strong); display: flex; flex-wrap: wrap; gap: 1em;
    }
    .session__meta b { color: var(--line); font-weight: 400; letter-spacing: .04em; }
    .session__pages { list-style: none; padding: 0; margin: 0; }
    .session__page {
      display: flex; justify-content: space-between; gap: 14px;
      padding: 5px 0; font-size: 13px; border-bottom: 1px dashed rgba(231,76,60,.08);
    }
    .session__page:last-child { border-bottom: none; }
    .session__page__path { color: var(--text-strong); word-break: break-all; }
    .session__page__ts { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .session__referrer {
      color: var(--muted); font-size: 11px; margin-top: 6px;
      word-break: break-all;
    }
    .session__ua {
      color: var(--muted); font-size: 10px; margin-top: 4px;
      word-break: break-all; opacity: .7;
    }

    .state-msg { padding: 30px 0; color: var(--muted); text-align: center; }

    @media (max-width: 700px) {
      .wrap { padding: 20px 14px 48px; }
      .summary { grid-template-columns: repeat(2, 1fr); }
      .session__head { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body class="pass-locked">
  <div id="passGate">
    <h1>RESTRICTED // VISITORS</h1>
    <input id="passInput" type="password" autocomplete="off" placeholder="Passphrase" autofocus />
    <button id="passSubmit" type="button">Enter</button>
    <div id="passErr" class="err"></div>
  </div>

  <div class="wrap">
    <div class="header">
      <h1>VISITORS</h1>
      <p>First-party pageview log. One row per beacon. Sessions grouped by browser session ID.</p>
    </div>

    <div class="toolbar">
      <input id="filterInput" placeholder="Filter by IP, location, path, user agent..." />
      <button id="refreshBtn" type="button">Refresh</button>
    </div>

    <div class="summary">
      <div class="card">
        <div class="label">Sessions</div>
        <div class="value" id="statSessions">--</div>
        <div class="sub">unique browser sessions</div>
      </div>
      <div class="card">
        <div class="label">Pageviews</div>
        <div class="value" id="statPageviews">--</div>
        <div class="sub">total beacons received</div>
      </div>
      <div class="card">
        <div class="label">Unique IPs</div>
        <div class="value" id="statIps">--</div>
        <div class="sub">distinct source addresses</div>
      </div>
      <div class="card">
        <div class="label">Last seen</div>
        <div class="value" id="statLast">--</div>
        <div class="sub">most recent pageview</div>
      </div>
    </div>

    <div id="state" class="state-msg">Loading.</div>
    <div id="sessions" class="sessions"></div>
  </div>

  <script>
    // Passphrase gate. Same SHA-256 hash as /admin/quiz, /admin/logs,
    // /admin/metrics. One passphrase unlocks every internal tool.
    (function () {
      var EXPECTED_HASH = "64354c5c7192a65cc78df77adbf77b4df37d6c60868cc83085f48f4f97e5848f";
      var SESSION_KEY = "sb-visitors-admin-unlocked";

      async function sha256Hex(str) {
        var enc = new TextEncoder().encode(str);
        var buf = await crypto.subtle.digest("SHA-256", enc);
        return Array.from(new Uint8Array(buf))
          .map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
      }
      function unlock() {
        document.body.classList.remove("pass-locked");
        var g = document.getElementById("passGate");
        if (g) g.remove();
        if (window.__visitorsBoot) window.__visitorsBoot();
      }
      try {
        if (sessionStorage.getItem(SESSION_KEY) === "1") { unlock(); return; }
      } catch (e) {}
      var input = document.getElementById("passInput");
      var btn = document.getElementById("passSubmit");
      var err = document.getElementById("passErr");
      async function check() {
        err.textContent = "";
        var typed = input.value;
        if (!typed) { err.textContent = "Empty."; return; }
        var hash = await sha256Hex(typed);
        if (hash === EXPECTED_HASH) {
          try { sessionStorage.setItem(SESSION_KEY, "1"); } catch (e) {}
          unlock();
        } else {
          err.textContent = "Wrong passphrase.";
          input.value = ""; input.focus();
        }
      }
      btn.addEventListener("click", check);
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") check(); });
    })();
  </script>

  <script>
    // Visitors data loader + renderer.
    // VISITOR_API and ADMIN_KEY are set after the visitor-logger
    // Lambda is deployed. Until then leave both empty and the page
    // will render "endpoint not configured" politely.
    window.__visitorsBoot = function () {
      var VISITOR_API = "https://e22aox3mcuorb4yaalmd7hp7yu0irwyc.lambda-url.us-east-1.on.aws/";
      var ADMIN_KEY   = "shieldbearer-visits-2026";

      var state = document.getElementById("state");
      var sessionsEl = document.getElementById("sessions");
      var filterEl = document.getElementById("filterInput");
      var refreshBtn = document.getElementById("refreshBtn");

      var allItems = [];

      function escapeText(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function fmtTs(iso) {
        if (!iso) return "";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        return d.toLocaleString("en-US", {
          year: "numeric", month: "short", day: "numeric",
          hour: "2-digit", minute: "2-digit", second: "2-digit",
          timeZoneName: "short"
        });
      }

      function fmtRelative(iso) {
        if (!iso) return "";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return "";
        var diff = Math.max(0, Date.now() - d.getTime());
        var sec = Math.floor(diff / 1000);
        if (sec < 60) return sec + "s ago";
        var min = Math.floor(sec / 60);
        if (min < 60) return min + "m ago";
        var hr = Math.floor(min / 60);
        if (hr < 48) return hr + "h ago";
        var day = Math.floor(hr / 24);
        return day + "d ago";
      }

      function groupBySession(items) {
        var bySession = new Map();
        for (var i = 0; i < items.length; i++) {
          var it = items[i] || {};
          var sid = String(it.session_id || "");
          if (!sid) continue;
          if (!bySession.has(sid)) {
            bySession.set(sid, {
              session_id: sid,
              ip: it.ip || "unknown",
              location: it.location || "unknown",
              user_agent: it.user_agent || "",
              referrer: it.referrer || "",
              pages: []
            });
          }
          var s = bySession.get(sid);
          // Items arrive newest-first from server; we reverse per
          // session so the page list reads earliest -> latest.
          s.pages.push({ path: it.path, ts: it.ts_open });
          // First (newest) item in the bucket carries the canonical
          // ip + location + ua + referrer. Don't overwrite with
          // older rows that may have unknown ip if the lookup failed.
          if (s.ip === "unknown" && it.ip && it.ip !== "unknown") s.ip = it.ip;
          if (s.location === "unknown" && it.location && it.location !== "unknown") s.location = it.location;
          if (!s.user_agent && it.user_agent) s.user_agent = it.user_agent;
          if (!s.referrer && it.referrer) s.referrer = it.referrer;
        }
        var sessions = Array.from(bySession.values());
        for (var j = 0; j < sessions.length; j++) {
          sessions[j].pages.sort(function (a, b) {
            return String(a.ts || "").localeCompare(String(b.ts || ""));
          });
          var pages = sessions[j].pages;
          sessions[j].first_ts = pages.length ? pages[0].ts : "";
          sessions[j].last_ts = pages.length ? pages[pages.length - 1].ts : "";
        }
        sessions.sort(function (a, b) {
          return String(b.last_ts || "").localeCompare(String(a.last_ts || ""));
        });
        return sessions;
      }

      function matchesFilter(session, q) {
        if (!q) return true;
        var hay = [
          session.ip, session.location, session.user_agent, session.referrer
        ].concat(session.pages.map(function (p) { return p.path; })).join(" ").toLowerCase();
        return hay.indexOf(q.toLowerCase()) !== -1;
      }

      function renderSummary(items) {
        var sessionIds = new Set();
        var ips = new Set();
        var latest = "";
        for (var i = 0; i < items.length; i++) {
          if (items[i].session_id) sessionIds.add(items[i].session_id);
          if (items[i].ip && items[i].ip !== "unknown") ips.add(items[i].ip);
          if (items[i].ts_open && (!latest || items[i].ts_open > latest)) latest = items[i].ts_open;
        }
        document.getElementById("statSessions").textContent = String(sessionIds.size);
        document.getElementById("statPageviews").textContent = String(items.length);
        document.getElementById("statIps").textContent = String(ips.size);
        document.getElementById("statLast").textContent = latest ? fmtRelative(latest) : "--";
      }

      function renderSessions() {
        var q = filterEl.value.trim();
        var grouped = groupBySession(allItems);
        var filtered = grouped.filter(function (s) { return matchesFilter(s, q); });
        if (!filtered.length) {
          sessionsEl.innerHTML = "";
          state.style.display = "block";
          state.textContent = grouped.length
            ? "No sessions match the filter."
            : "No sessions yet. Beacon may not be wired up, or no one has visited.";
          return;
        }
        state.style.display = "none";
        sessionsEl.innerHTML = filtered.map(function (s) {
          var pagesHtml = s.pages.map(function (p) {
            return '<li class="session__page">' +
              '<span class="session__page__path">' + escapeText(p.path) + '</span>' +
              '<span class="session__page__ts">' + escapeText(fmtTs(p.ts)) + '</span>' +
            '</li>';
          }).join("");
          var refHtml = s.referrer
            ? '<div class="session__referrer">referrer: ' + escapeText(s.referrer) + '</div>'
            : '';
          var uaHtml = s.user_agent
            ? '<div class="session__ua">' + escapeText(s.user_agent) + '</div>'
            : '';
          return '<div class="session">' +
            '<div class="session__head">' +
              '<div class="session__meta">' +
                '<span><b>' + escapeText(s.ip) + '</b></span>' +
                '<span>' + escapeText(s.location) + '</span>' +
                '<span>' + escapeText(s.pages.length) + ' page' + (s.pages.length === 1 ? '' : 's') + '</span>' +
                '<span>' + escapeText(fmtRelative(s.last_ts)) + '</span>' +
              '</div>' +
              '<div class="session__id">' + escapeText(s.session_id) + '</div>' +
            '</div>' +
            '<ul class="session__pages">' + pagesHtml + '</ul>' +
            refHtml +
            uaHtml +
          '</div>';
        }).join("");
      }

      async function loadData() {
        if (!VISITOR_API) {
          state.style.display = "block";
          state.textContent = "Visitor API endpoint not configured. Deploy sentinelbot-visitor-logger and paste the URL into VISITOR_API at the top of this page.";
          return;
        }
        state.style.display = "block";
        state.textContent = "Loading.";
        sessionsEl.innerHTML = "";
        try {
          var res = await fetch(VISITOR_API, {
            method: "GET",
            headers: { "x-admin-key": ADMIN_KEY }
          });
          if (res.status === 401) {
            state.textContent = "Unauthorized. Check ADMIN_KEY.";
            return;
          }
          if (!res.ok) {
            state.textContent = "HTTP " + res.status + " from the visitor logger.";
            return;
          }
          var data = await res.json();
          allItems = Array.isArray(data.items) ? data.items : [];
          renderSummary(allItems);
          renderSessions();
        } catch (e) {
          state.textContent = "Fetch failed: " + (e && e.message ? e.message : "unknown");
        }
      }

      filterEl.addEventListener("input", renderSessions);
      refreshBtn.addEventListener("click", loadData);
      loadData();
    };
  </script>
</body>
</html>
